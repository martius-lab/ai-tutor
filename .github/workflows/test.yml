name: Tests

# Run on pull requests and when merging to main branch
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0

      - name: Install the project
        run: uv sync

      - name: Run tests
        run: uv run pytest tests/
