name: Tests

# Run on pull requests and when merging to main branch
on:
  pull_request:

permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: docker compose build
        run: COMPOSE_BAKE=true docker compose build

      - name: test db migration
        run: |
          echo POSTGRES_PASSWORD=secret > .env
          docker compose -f compose.yaml -f compose.prod.yaml up --no-start
          docker compose -f compose.yaml -f compose.prod.yaml start db
          sleep 10  # wait for the database to be ready
          docker compose -f compose.yaml -f compose.prod.yaml run app reflex db migrate
